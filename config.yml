# PlayerCannon Konfiguration  (nach Änderungen: /playercannon reload)

# Wohin die Pearls fliegen:
#   OWNER = zu DIR. Die Pearls erscheinen über dir (im Radius unten) und teleportieren
#           die Spieler zu dir, egal wo sie sind (auch andere Welten, keine Reichweite)
#   HOOK  = zur Position des Angel-Hooks (hier gilt max-distance)
# Im Spiel umschaltbar mit /playercannon mode <me|hook>
target-mode: OWNER

# Nur OWNER-Modus: Radius (Blöcke) um dich, in dem die Pearls erscheinen
sky-radius: 5.0
# Nur OWNER-Modus: Höhe (Blöcke) über dir, in der die Pearls erscheinen
sky-height: 10.0

# Wartezeit zwischen zwei Schüssen pro Spieler (Millisekunden)
cooldown-ms: 1000

# Abstand zwischen den einzelnen Pearls in Ticks (20 Ticks = 1 Sekunde). 0 = alle gleichzeitig
launch-delay-ticks: 2

# Nur HOOK-Modus: Maximale Entfernung (Blöcke) zwischen Schütze und Hook
max-distance: 150

# true = kein Enderpearl-Schaden beim Aufprall (Teleport ohne Fallschaden)
no-pearl-damage: true

# Partikel-Spur der Pearls im Flug
trail-particles: true

# Sounds & Effekte (Start, Ziel, Teleport)
effects: true

# Verlinkte Spieler bekommen eine Actionbar-Nachricht, wenn sie abgefeuert werden
notify-linked: true

# Name der Angel (Farbcodes mit &)
rod-name: "&d&lPlayer Cannon"
rod-lore:
  - "&7Auswerfen & einholen:"
  - "&7Verlinkte Spieler fliegen zum Hook."

# Effekte für verlinkte Spieler (damit sie sofort fight ready sind)
buffs:
  # Effekte an/aus
  enabled: true
  # Wie lange die Effekte dauern (Sekunden)
  duration-seconds: 600
  # Level (2 = Strength II / Speed II). 0 = Effekt aus
  strength-level: 2
  speed-level: 2
  # Fire Resistance geben
  fire-resistance: true
  # true = Effekte schon direkt beim Verlinken geben, false = erst beim Abfeuern
  apply-on-link: false
